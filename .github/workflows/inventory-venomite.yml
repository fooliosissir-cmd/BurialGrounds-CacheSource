name: Inventory Venomite 718 package

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/inventory-venomite.yml"

permissions:
  contents: write

concurrency:
  group: inventory-venomite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y megatools p7zip-full file

      - name: Download and inventory Venomite source package
        shell: bash
        env:
          VENOMITE_SOURCE_URL: "https://mega.nz/file/m65TlKDT#m_4DHtbOx3H8h_RVB9KJSZHVDVVksjiuVAsEcSO76Zw"
        run: |
          set -u
          root="/tmp/bg-venomite"
          pkg="$root/venomite-source.pkg"
          extract="$root/extracted"
          report="docs/generated-venomite-package-inventory.md"
          mkdir -p "$root"

          cat > "$report" <<'EOF'
          # Generated Venomite 718 Package Inventory

          Generated in a temporary GitHub Actions runner. The raw third-party package and extracted files are not committed. No bundled executable is run.

          EOF

          echo "## Source package" >> "$report"
          echo >> "$report"

          if ! timeout 20m megatools dl --no-progress --path "$pkg" "$VENOMITE_SOURCE_URL" >"$root/mega.log" 2>&1; then
            echo "**Download failed or timed out.**" >> "$report"
            echo >> "$report"
            echo "~~~text" >> "$report"
            tail -80 "$root/mega.log" | sed -E 's/(https:\/\/mega\.nz\/file\/[^#[:space:]]+)#[^[:space:]]+/\1#REDACTED/g' >> "$report"
            echo "~~~" >> "$report"
            exit 0
          fi

          if [ ! -f "$pkg" ]; then
            candidate="$(find "$root" -maxdepth 3 -type f ! -name 'mega.log' | head -1 || true)"
            if [ -n "$candidate" ]; then
              pkg="$candidate"
            fi
          fi

          if [ ! -f "$pkg" ]; then
            echo "**Download command completed but no package file was found.**" >> "$report"
            exit 0
          fi

          bytes="$(stat -c %s "$pkg")"
          sha="$(sha256sum "$pkg" | awk '{print $1}')"
          kind="$(file -b "$pkg" | tr '|' '/')"
          printf -- '- Bytes: %s\n- SHA-256: %s\n- Detected type: %s\n\n' "$bytes" "$sha" "$kind" >> "$report"

          echo "### Archive listing sample" >> "$report"
          echo >> "$report"
          echo "~~~text" >> "$report"
          if timeout 5m 7z l -ba "$pkg" >"$root/listing.txt" 2>"$root/listing.err"; then
            head -250 "$root/listing.txt" >> "$report"
          else
            echo "7z could not list the package:" >> "$report"
            head -80 "$root/listing.err" >> "$report"
          fi
          echo "~~~" >> "$report"
          echo >> "$report"

          mkdir -p "$extract"
          if ! timeout 20m 7z x -y -o"$extract" "$pkg" >"$root/extract.log" 2>&1; then
            echo "## Extraction status" >> "$report"
            echo >> "$report"
            echo "**Extraction failed or timed out.**" >> "$report"
            echo "~~~text" >> "$report"
            tail -100 "$root/extract.log" >> "$report"
            echo "~~~" >> "$report"
            exit 0
          fi

          total_files="$(find "$extract" -type f | wc -l)"
          total_dirs="$(find "$extract" -type d | wc -l)"
          total_bytes="$(du -sb "$extract" | awk '{print $1}')"

          echo "## Extracted tree summary" >> "$report"
          echo >> "$report"
          printf -- '- Files: %s\n- Directories: %s\n- Unpacked bytes: %s\n\n' "$total_files" "$total_dirs" "$total_bytes" >> "$report"

          echo "### File extensions" >> "$report"
          echo >> "$report"
          echo '| Extension | Files |' >> "$report"
          echo '| --- | ---: |' >> "$report"
          find "$extract" -type f -printf '%f\n' |
            awk '{
              n=$0
              if (n !~ /\./) ext="[none]"
              else { sub(/^.*\./, "", n); ext=tolower(n) }
              count[ext]++
            }
            END { for (e in count) print count[e], e }' |
            sort -nr |
            sed -n '1,80p' |
            while read -r count ext; do
              printf '| %s | %s |\n' "$ext" "$count" >> "$report"
            done
          echo >> "$report"

          echo "### Top-level tree" >> "$report"
          echo >> "$report"
          echo "~~~text" >> "$report"
          find "$extract" -mindepth 1 -maxdepth 3 -printf '%P\n' | sort | sed -n '1,400p' >> "$report"
          echo "~~~" >> "$report"
          echo >> "$report"

          echo "## Custom-content candidate paths" >> "$report"
          echo >> "$report"
          echo "~~~text" >> "$report"
          find "$extract" -type f -printf '%P\n' |
            grep -Ei '(boss|raid|event|model|npc|item|interface|map|vorkath|zulrah|cerberus|kraken|sire|hydra|olm|tekton|vasa|vespula|verzik|maiden|nightmare|custom)' |
            sort |
            sed -n '1,1200p' >> "$report" || true
          echo "~~~" >> "$report"
          echo >> "$report"

          echo "## Potential source-code definitions" >> "$report"
          echo >> "$report"
          echo "~~~text" >> "$report"
          find "$extract" -type f \( -iname '*.java' -o -iname '*.kt' -o -iname '*.json' -o -iname '*.txt' \) -size -4M -print0 |
            xargs -0 grep -IlE '(Boss|boss|Raid|raid|NPC|Npc|npc|custom model|Custom Model)' 2>/dev/null |
            sed "s#^$extract/##" |
            sort |
            sed -n '1,1000p' >> "$report" || true
          echo "~~~" >> "$report"
          echo >> "$report"

          echo "## Safety / import status" >> "$report"
          echo >> "$report"
          echo "- Inspection only; no third-party executable was run." >> "$report"
          echo "- Raw package and extracted payload are not committed." >> "$report"
          echo "- Candidate models/maps/configs still require 727 ID/dependency/provenance review before Developer World packing." >> "$report"

      - name: Unpack nested archives and build focused content index
        shell: bash
        run: |
          set -u
          root="/tmp/bg-venomite"
          extract="$root/extracted"
          nested_report="docs/generated-venomite-nested-archive-inventory.md"
          content_report="docs/generated-venomite-content-index.md"

          cat > "$nested_report" <<'EOF'
          # Generated Venomite Nested Archive Inventory

          This inventory continues the temporary unpack of the Venomite source package. Nested archives are extracted only on the GitHub Actions runner and are not committed.

          EOF

          if [ ! -d "$extract" ]; then
            echo "**Top-level extraction is unavailable; nested inventory could not run.**" >> "$nested_report"
          else
            nested_count="$(find "$extract" -type f \( -iname '*.rar' -o -iname '*.zip' -o -iname '*.7z' -o -iname '*.gz' \) | wc -l)"
            echo "- Nested archive candidates: $nested_count" >> "$nested_report"
            echo >> "$nested_report"

            find "$extract" -type f \( -iname '*.rar' -o -iname '*.zip' -o -iname '*.7z' -o -iname '*.gz' \) -print0 |
              sort -z |
              while IFS= read -r -d '' nested; do
                rel="${nested#"$extract"/}"
                bytes="$(stat -c %s "$nested")"
                sha="$(sha256sum "$nested" | awk '{print $1}')"
                kind="$(file -b "$nested" | tr '|' '/')"
                key="$(printf '%s' "$rel" | sha256sum | cut -c1-16)"
                ndir="$root/nested/$key"
                mkdir -p "$ndir"

                echo "## $rel" >> "$nested_report"
                echo >> "$nested_report"
                echo "- Bytes: $bytes" >> "$nested_report"
                echo "- SHA-256: $sha" >> "$nested_report"
                echo "- Type: $kind" >> "$nested_report"
                echo >> "$nested_report"
                echo "### Listing sample" >> "$nested_report"
                echo >> "$nested_report"
                echo "~~~text" >> "$nested_report"
                if timeout 5m 7z l -ba "$nested" >"$root/nested-listing-$key.txt" 2>"$root/nested-listing-$key.err"; then
                  head -180 "$root/nested-listing-$key.txt" >> "$nested_report"
                else
                  cat "$root/nested-listing-$key.err" | head -80 >> "$nested_report"
                fi
                echo "~~~" >> "$nested_report"
                echo >> "$nested_report"

                free_kb="$(df -Pk "$root" | awk 'NR==2 {print $4}')"
                if [ "$free_kb" -lt 3145728 ]; then
                  echo "**Skipped extraction because less than 3 GiB of runner disk remained.**" >> "$nested_report"
                  echo >> "$nested_report"
                  continue
                fi

                if timeout 10m 7z x -y -o"$ndir" "$nested" >"$root/nested-extract-$key.log" 2>&1; then
                  nfiles="$(find "$ndir" -type f | wc -l)"
                  nbytes="$(du -sb "$ndir" | awk '{print $1}')"
                  echo "- Extraction: success" >> "$nested_report"
                  echo "- Extracted files: $nfiles" >> "$nested_report"
                  echo "- Extracted bytes: $nbytes" >> "$nested_report"
                  echo >> "$nested_report"
                  echo "### Extracted tree sample" >> "$nested_report"
                  echo >> "$nested_report"
                  echo "~~~text" >> "$nested_report"
                  find "$ndir" -type f -printf '%P\n' | sort | sed -n '1,300p' >> "$nested_report"
                  echo "~~~" >> "$nested_report"
                  echo >> "$nested_report"
                else
                  echo "- Extraction: failed or timed out" >> "$nested_report"
                  echo >> "$nested_report"
                  echo "~~~text" >> "$nested_report"
                  tail -100 "$root/nested-extract-$key.log" >> "$nested_report"
                  echo "~~~" >> "$nested_report"
                  echo >> "$nested_report"
                fi
              done
          fi

          cat > "$content_report" <<'EOF'
          # Generated Venomite Custom Content Index

          Focused file-level index from the unpacked Venomite 718 source package. This records names and locations only; third-party source/model/cache payloads are not committed.

          EOF

          if [ ! -d "$extract" ]; then
            echo "**Top-level extraction is unavailable; focused inventory could not run.**" >> "$content_report"
            exit 0
          fi

          npcroot="$extract/718-Server/src/main/java/com/rs/game/world/entity/npc"

          echo "## Boss and encounter implementation candidates" >> "$content_report"
          echo >> "$content_report"
          echo "~~~text" >> "$content_report"
          if [ -d "$npcroot" ]; then
            find "$npcroot" -type f -iname '*.java' -printf '%P\n' |
              grep -Ei '(boss|cerber|sire|zalcano|venen|vetion|scorpia|fanatic|archaeologist|lava.?dragon|demonic.?gorilla|donkey|madara|wolverine|alchemist|master.?of.?fear|party.?demon|champion|vorago|kalger|queen|jad|har.?aken|shaman|thermo|wildy|wyrm|zombie|superior)' |
              sort >> "$content_report" || true
          fi
          echo "~~~" >> "$content_report"
          echo >> "$content_report"

          echo "## Unusual/custom NPC class names" >> "$content_report"
          echo >> "$content_report"
          echo "~~~text" >> "$content_report"
          if [ -d "$npcroot" ]; then
            find "$npcroot" -type f -iname '*.java' -printf '%P\n' |
              grep -Ei '(others/|FlashMobs/|randomspawns/|wilderness/|zalcano/|sire/|cerber|shaman/|thermo/)' |
              sort |
              head -800 >> "$content_report" || true
          fi
          echo "~~~" >> "$content_report"
          echo >> "$content_report"

          echo "## Server NPC data files" >> "$content_report"
          echo >> "$content_report"
          echo "~~~text" >> "$content_report"
          if [ -d "$extract/718-Server/data/npcs" ]; then
            find "$extract/718-Server/data/npcs" -type f -printf '%P\n' | sort | sed -n '1,800p' >> "$content_report"
          fi
          echo "~~~" >> "$content_report"
          echo >> "$content_report"

          echo "## Server item data files" >> "$content_report"
          echo >> "$content_report"
          echo "~~~text" >> "$content_report"
          if [ -d "$extract/718-Server/data/items" ]; then
            find "$extract/718-Server/data/items" -type f -printf '%P\n' | sort | sed -n '1,800p' >> "$content_report"
          fi
          echo "~~~" >> "$content_report"
          echo >> "$content_report"

          echo "## Server map/spawn data files" >> "$content_report"
          echo >> "$content_report"
          echo "~~~text" >> "$content_report"
          if [ -d "$extract/718-Server/data/map" ]; then
            find "$extract/718-Server/data/map" -type f -printf '%P\n' | sort | sed -n '1,800p' >> "$content_report"
          fi
          echo "~~~" >> "$content_report"
          echo >> "$content_report"

          echo "## Custom-interface / model-tool references" >> "$content_report"
          echo >> "$content_report"
          echo "~~~text" >> "$content_report"
          find "$extract/718-Server" -type f -printf '%P\n' |
            grep -Ei '(interface|model|cache|itemdef|npcdef|objectdef|renderanim)' |
            sort |
            sed -n '1,1000p' >> "$content_report" || true
          echo "~~~" >> "$content_report"

      - name: Commit generated inventory
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- docs/generated-venomite-package-inventory.md docs/generated-venomite-nested-archive-inventory.md docs/generated-venomite-content-index.md)" ]; then
            echo "Inventories unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated-venomite-package-inventory.md docs/generated-venomite-nested-archive-inventory.md docs/generated-venomite-content-index.md
          git commit -m "docs: deepen Venomite 718 unpack inventory"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
