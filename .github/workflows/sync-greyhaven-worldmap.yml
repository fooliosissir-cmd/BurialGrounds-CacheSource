name: Sync Greyhaven World Map

on:
  push:
    branches: [dev, "feature/**"]
    paths:
      - "maps/**/locs.json"
      - "maps/**/terrain.json"
      - "tools/sync_greyhaven_worldmap.py"
      - ".github/workflows/sync-greyhaven-worldmap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-greyhaven-worldmap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Regenerate Greyhaven world-map area
        run: python3 tools/sync_greyhaven_worldmap.py

      - name: Commit generated area when changed
        run: |
          if git diff --quiet -- worldmapdata/95/4.dat; then
            echo "World-map area already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worldmapdata/95/4.dat
          git commit -m "Sync Greyhaven world map area"
          git push origin "HEAD:${GITHUB_REF_NAME}"
