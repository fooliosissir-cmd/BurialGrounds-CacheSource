name: One-shot import Stugger map payloads

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/import-stugger-basic-map-packer.yml"

permissions:
  contents: write

concurrency:
  group: import-stugger-basic-map-packer
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout only import paths
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/import-stugger-basic-map-packer.yml
            tools/external-content/stugger-basic-map-packer

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download exact public Edgeville V1.2 source
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/edgeville-v3.rar"
          url="https://www.dropbox.com/scl/fi/odbrsrvivfr7j9ktgt8eb/Edgeville-V3.rar?rlkey=z8542e6fr5qp9e7h2yuw1q70p&dl=1"
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$url" -o "$archive"
          echo "7de1ddfece3f7ea062bbc80d831774436b4e15f7eb08768f0aeaafc565c45c41  $archive" | sha256sum -c -
          rm -rf /tmp/stugger-edgeville
          mkdir -p /tmp/stugger-edgeville
          7z x -y -o/tmp/stugger-edgeville "$archive"

      - name: Import and verify exact map bytes
        shell: bash
        run: |
          set -euo pipefail
          root="tools/external-content/stugger-basic-map-packer"
          src="/tmp/stugger-edgeville/Edgeville V1.2"

          mkdir -p "$root/data/mapfiles/667/12342" "$root/data/mapfiles/718/12342"

          cp "$src/667/12342/624_map" "$root/data/mapfiles/667/12342/624_map"
          cp "$src/667/12342/625_land" "$root/data/mapfiles/667/12342/625_land"
          cp "$src/667/12342/2491_undermap" "$root/data/mapfiles/667/12342/2491_undermap"

          cp "$src/718/12342/3469_map" "$root/data/mapfiles/718/12342/3469_map"
          cp "$src/718/12342/3470_undermap" "$root/data/mapfiles/718/12342/3470_undermap"
          cp "$src/718/12342/3471_land" "$root/data/mapfiles/718/12342/3471_land"

          echo "dcd5c81cfcd105a4f3098ef0a5b0e46a9e95a34628d6513c41e6f381bbc41145  $root/data/mapfiles/667/12342/624_map" | sha256sum -c -
          echo "8df7be884c8bef92a94fc09f550d4ab63171744bd5b1ee0617b224fadbed0603  $root/data/mapfiles/667/12342/625_land" | sha256sum -c -
          echo "46e7292020f888064a3df40bb53974dfe4cdf9c30b27f80efc6c0c4f3e6541e2  $root/data/mapfiles/667/12342/2491_undermap" | sha256sum -c -
          echo "dcd5c81cfcd105a4f3098ef0a5b0e46a9e95a34628d6513c41e6f381bbc41145  $root/data/mapfiles/718/12342/3469_map" | sha256sum -c -
          echo "46e7292020f888064a3df40bb53974dfe4cdf9c30b27f80efc6c0c4f3e6541e2  $root/data/mapfiles/718/12342/3470_undermap" | sha256sum -c -
          echo "8df7be884c8bef92a94fc09f550d4ab63171744bd5b1ee0617b224fadbed0603  $root/data/mapfiles/718/12342/3471_land" | sha256sum -c -

          rm -rf "$root/.incoming"

      - name: Commit imported payloads
        shell: bash
        run: |
          set -euo pipefail
          root="tools/external-content/stugger-basic-map-packer"
          if [ -z "$(git status --porcelain -- "$root")" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A "$root"
          git commit -m "chore(cache): vendor Stugger Edgeville example maps"
          git pull --rebase origin dev
          git push origin HEAD:dev
