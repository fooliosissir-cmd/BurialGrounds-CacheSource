name: Inventory public custom map archives

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/inventory-public-custom-maps.yml"

permissions:
  contents: write

concurrency:
  group: inventory-public-custom-maps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip file

      - name: Download, unpack, and inventory public releases
        shell: bash
        run: |
          set -u
          root="/tmp/bg-custom-archives"
          mkdir -p "$root"
          summary="docs/generated-public-map-archive-inventory.md"
          details="docs/generated-public-map-file-inventory.md"

          cat > "$summary" <<'EOF'
          # Generated Public Custom Map Archive Inventory

          Generated by GitHub Actions. Raw third-party archives are downloaded only into the temporary runner workspace for inspection; they are **not committed** to this repository.

          | Release | Download | SHA-256 | Bytes | Archive listing |
          | --- | --- | --- | ---: | --- |
          EOF

          cat > "$details" <<'EOF'
          # Generated Public Custom Map File Inventory

          This is a per-file inventory produced by actually extracting each publicly downloadable archive in a temporary GitHub Actions workspace. Raw third-party files are not committed.

          EOF

          clean_text () {
            tr '\n' ' ' | tr '|' '/' | tr '`' "'" | sed 's/[[:space:]][[:space:]]*/ /g'
          }

          append_file_table () {
            local basedir="$1"
            local prefix="$2"

            if [ ! -d "$basedir" ]; then
              return
            fi

            find "$basedir" -type f ! -path "$basedir/__nested__/*" -print0 | sort -z | while IFS= read -r -d '' member; do
              local rel bytes sha kind
              rel="${member#"$basedir"/}"
              bytes="$(stat -c %s "$member")"
              sha="$(sha256sum "$member" | awk '{print $1}')"
              kind="$(file -b "$member" | clean_text)"
              printf '| %s%s | %s | `%s` | %s |\n' "$prefix" "$rel" "$bytes" "$sha" "$kind" >> "$details"
            done
          }

          inspect_nested () {
            local basedir="$1"
            local release="$2"
            local n=0

            find "$basedir" -type f ! -path "$basedir/__nested__/*" \( -iname '*.rar' -o -iname '*.zip' -o -iname '*.7z' -o -iname '*.gz' \) -print0 | while IFS= read -r -d '' nested; do
              n=$((n+1))
              local rel key ndir
              rel="${nested#"$basedir"/}"
              key="$(printf '%s' "$rel" | sha256sum | cut -c1-16)"
              ndir="$basedir/__nested__/$key"
              mkdir -p "$ndir"

              if 7z x -y -o"$ndir" "$nested" >/tmp/nested-extract.log 2>&1; then
                printf '\n### Nested archive: %s / %s\n\n' "$release" "$rel" >> "$details"
                printf '| Extracted path | Bytes | SHA-256 | Type |\n| --- | ---: | --- | --- |\n' >> "$details"
                find "$ndir" -type f -print0 | sort -z | while IFS= read -r -d '' member; do
                  local nrel bytes sha kind
                  nrel="${member#"$ndir"/}"
                  bytes="$(stat -c %s "$member")"
                  sha="$(sha256sum "$member" | awk '{print $1}')"
                  kind="$(file -b "$member" | clean_text)"
                  printf '| %s | %s | `%s` | %s |\n' "$nrel" "$bytes" "$sha" "$kind" >> "$details"
                done
              fi
            done
          }

          inspect () {
            local name="$1"
            local url="$2"
            local file="$3"
            local out="$root/$file"
            local slug="${file%.*}"
            local extract="$root/extracted/$slug"
            local listing=""

            printf '\n## %s\n\n' "$name" >> "$details"

            if curl -fL --retry 3 --connect-timeout 20 --max-time 180 "$url" -o "$out"; then
              local sha size kind
              sha="$(sha256sum "$out" | awk '{print $1}')"
              size="$(stat -c %s "$out")"
              kind="$(file -b "$out" | clean_text)"

              printf -- '- Source archive: `%s`\n- Archive SHA-256: `%s`\n- Archive bytes: %s\n- Detected type: %s\n\n' "$file" "$sha" "$size" "$kind" >> "$details"

              if 7z l -ba "$out" >/tmp/listing.txt 2>/tmp/listing.err; then
                listing="$(awk '{for(i=6;i<=NF;i++){printf "%s%s",$i,(i<NF?" ":"")}; print ""}' /tmp/listing.txt | sed '/^$/d' | head -80 | paste -sd ';' -)"
                [ -z "$listing" ] && listing="Archive opened; no member names parsed"
                printf '| %s | downloaded | `%s` | %s | %s — %s |\n' "$name" "$sha" "$size" "$kind" "$listing" >> "$summary"

                rm -rf "$extract"
                mkdir -p "$extract"
                if 7z x -y -o"$extract" "$out" >/tmp/extract.log 2>&1; then
                  printf '| Extracted path | Bytes | SHA-256 | Type |\n| --- | ---: | --- | --- |\n' >> "$details"
                  append_file_table "$extract" ""
                  inspect_nested "$extract" "$name"
                else
                  printf '**Extraction failed:** %s\n' "$(cat /tmp/extract.log | clean_text | head -c 600)" >> "$details"
                fi
              else
                listing="UNPACK ERROR: $(cat /tmp/listing.err | clean_text | head -c 400)"
                printf '| %s | downloaded | `%s` | %s | %s — %s |\n' "$name" "$sha" "$size" "$kind" "$listing" >> "$summary"
                printf '**Archive listing failed:** %s\n' "$listing" >> "$details"
              fi
            else
              printf '| %s | DOWNLOAD BLOCKED/FAILED | — | — | External host did not yield archive bytes on this run |\n' "$name" >> "$summary"
              printf '**Download blocked/failed in CI.**\n' >> "$details"
            fi
          }

          # Stugger 667/718 HD map releases.
          inspect "Snowy Area V1" "https://www.dropbox.com/scl/fi/1l3q1e7h1c1yqvwxiorc3/Snow-Area-V1.rar?rlkey=12g55ox1pe8fxlixz8e4020yl&dl=1" "snow-area-v1.rar"
          inspect "Boss/Raids Room V1" "https://www.dropbox.com/scl/fi/35lp6vk0q7jb2q71dplzh/Raids-Room-V1.rar?rlkey=qkemvomlgmlmeinyq77sh1c4e&dl=1" "raids-room-v1.rar"
          inspect "Boss/Raids Room V1.1" "https://www.dropbox.com/scl/fi/txne0eog4gy2jqsrstbn2/Raids-Room-V1.1.rar?rlkey=ec97tlt0z19qwml40l1ew5741&dl=1" "raids-room-v1.1.rar"
          inspect "Home Island V1" "https://www.dropbox.com/scl/fi/uucu1kqrejzsu4npeuvtl/Home-Island-V1.rar?rlkey=rdjnu0e4t86jabyj91d2o2ufn&dl=1" "home-island-v1.rar"
          inspect "Home Island V1.1" "https://www.dropbox.com/scl/fi/m35o0royc01yicnnhoc42/Home-Island-V1.1.rar?rlkey=tux0m38hxp53hvwiq5qwopifx&dl=1" "home-island-v1.1.rar"
          inspect "Resource Dungeon V1" "https://www.dropbox.com/scl/fi/iqumqfzdoepkjjj9wqpgt/Resource-Dungeon-V1.rar?rlkey=v92h2ctoob7ud0wp4kgwjyim4&dl=1" "resource-dungeon-v1.rar"
          inspect "Edgeville V1.1 / V2" "https://www.dropbox.com/scl/fi/mxfzrlsf2gmxhg4udbrdh/Edgeville-V2.rar?rlkey=gqfzkq7scit4tfzlkmc1246m0&dl=1" "edgeville-v2.rar"
          inspect "Edgeville V1.2 / V3" "https://www.dropbox.com/scl/fi/odbrsrvivfr7j9ktgt8eb/Edgeville-V3.rar?rlkey=z8542e6fr5qp9e7h2yuw1q70p&dl=1" "edgeville-v3.rar"
          inspect "Edgeville Remade" "https://www.dropbox.com/scl/fi/rdip3r3l2kjnkpbp0mnk9/Edgeville-Remade.rar?rlkey=lv39ffig14ndk8dm57b97ltjc&dl=1" "edgeville-remade.rar"

          # Other explicitly released public map archives.
          inspect "Barrows Island" "https://raw.githubusercontent.com/yrfate/public-maps/master/barrows%20island.zip" "barrows-island.zip"
          inspect "Chanston AhoyPK Donator Zone" "https://www.dropbox.com/s/zrde08zs9gsrq1y/bmxisrad%20donator%20zone.zip?dl=1" "chanston-donator-zone.zip"
          inspect "Chanston Underground Castlewars" "https://www.dropbox.com/s/77ufcu5dvd6ytb2/Underground%20CWS.zip?dl=1" "chanston-underground-castlewars.zip"
          inspect "Custom Manor map folder" "https://www.dropbox.com/sh/v1lzbgmojedz8if/AAAZBTUPEqnLkyEq843PO6h3a?dl=1" "custom-manor.zip"

          cat >> "$summary" <<'EOF'

          ## Not downloaded by this workflow

          The following remain metadata-only until an archive URL can be accessed without authentication or a copy is supplied for inspection:

          - Venomite 718/OSRS semi-custom package
          - Onyx / Matrix 2023 full 718 package
          - Noxious 718 custom cache/model release
          - 667/718 custom NPC/armor/item model pack
          - 667/718 high-revision Raid/OSRS model pack
          - MagePS organized maps/models
          - Hyperion 718/751 custom-boss package
          - 718/OSRS cache maps
          - custom two-floor boss map hosted through MediaFire
          - four-map community release hosted through Mega

          No login/access gate is bypassed and no third-party raw archive is committed.
          EOF

      - name: Commit inventories
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- docs/generated-public-map-archive-inventory.md docs/generated-public-map-file-inventory.md)" ]; then
            echo "Inventories unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated-public-map-archive-inventory.md docs/generated-public-map-file-inventory.md
          git commit -m "docs: refresh unpacked public map inventories"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
